<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waxyclips · Waxys Phantoms</title>
<link rel="stylesheet" href="brand.css?v=crest1">
<style>
  /* OBS browser source 1920x1080. Plays the channel's Twitch clips one after another, newest first, on loop.
     Params: ?n=10 how many clips (default 10), &sort=views plays the most watched instead of the newest,
     &muted=1 plays them silent (for under music). */
  .frame { position: absolute; inset: 0; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cap { position: absolute; left: 60px; bottom: 54px; display: flex; align-items: center; gap: 20px; padding: 16px 28px 16px 18px; max-width: 1300px; }
  .cap img { width: 64px; height: 64px; object-fit: contain; }
  .cap .t { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1.05; text-transform: uppercase; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1100px; }
  .cap .m { font-size: 20px; color: var(--muted); margin-top: 4px; }
  .cap .eyebrow { font-size: 16px; }
  .count { position: absolute; right: 60px; bottom: 54px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
</style>
</head>
<body>
<div class="scene">
  <div class="orb a"></div><div class="orb b"></div><div class="stripes"></div><div class="grain"></div>
  <div class="frame" id="frame" hidden></div>
  <div class="cap plate" id="cap" hidden>
    <img src="../brand/logo.png" alt="">
    <div>
      <div class="eyebrow">Waxyclips</div>
      <div class="t" id="title"></div>
      <div class="m" id="meta"></div>
    </div>
  </div>
  <div class="chip gold count" id="count" hidden></div>
  <div class="empty" id="empty"><div><div class="eyebrow">Waxyclips</div><div class="mega" style="font-size:140px">Loading<span class="thin">…</span></div></div></div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const API = q.get("api") || "https://waxydor-vote-api.vercel.app";
  const N = Math.max(1, +(q.get("n") || 10));
  const $ = (id) => document.getElementById(id);
  const ago = (iso) => { const d = Math.floor((Date.now() - new Date(iso)) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };
  let clips = [], i = 0;

  async function load() {
    try {
      const j = await (await fetch(API + "/api/clips", { cache: "no-store" })).json();
      let list = j.clips || [];
      if (q.get("sort") === "views") list = list.slice().sort((a, b) => b.views - a.views);
      clips = list.slice(0, N);
    } catch (e) { /* keep whatever we had */ }
  }

  function play() {
    if (!clips.length) {
      $("empty").innerHTML = '<div><div class="eyebrow">Waxyclips</div><div class="mega" style="font-size:140px">No clips <span class="thin">yet</span></div></div>';
      return setTimeout(() => load().then(play), 60000);
    }
    const c = clips[i % clips.length];
    $("empty").hidden = true; $("frame").hidden = false; $("cap").hidden = false; $("count").hidden = false;
    const src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(c.id)}&parent=${location.hostname}&autoplay=true&muted=${q.get("muted") === "1"}&preload=auto`;
    $("frame").innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen" scrolling="no"></iframe>`;
    $("title").textContent = c.title;
    $("meta").textContent = `Clipped by ${c.by} · ${ago(c.at)} · ${c.views} view${c.views === 1 ? "" : "s"}`;
    $("count").textContent = `${(i % clips.length) + 1} / ${clips.length}`;
    i++;
    // After a full loop, fetch again so new clips join the reel.
    const next = () => (i % clips.length === 0 ? load() : Promise.resolve()).then(play);
    setTimeout(next, (Math.ceil(c.seconds) + 2) * 1000);
  }

  load().then(play);
})();
</script>
</body>
</html>
