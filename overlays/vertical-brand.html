<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vertical brand · WaxySplash</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* OBS browser source 1080x1920 for vertical recording. Crest + twitch.tv/Waxysplash and nothing else. Transparent.
     Params (all optional): ?pos=top|bottom (crest position)  &size=360 (crest height px)  &bg=1 (brand background)
                            &series=Morocco Road to Glory  &ep=3  &title=Headline|line two (*word* = gold)  &handle=@tiktok
     Safe zones: the right 170px and bottom 440px stay clear for TikTok's buttons and caption. */
  .scene { width: 1080px; height: 1920px; }
  .wrap { position: absolute; inset: 0; padding: 110px 180px 460px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .crest { display: block; height: 360px; width: auto; border-radius: 22px; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); }
  .top, .bottom { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .chip { font-size: 28px; padding: 13px 22px; }
  .chip b { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 700; }
  .chip.handle { background: var(--purple); color: #130a24; border-color: var(--purple); }
  .series { display: inline-flex; align-items: center; gap: 14px; padding: 12px 20px; border-radius: 14px; }
  .series .flag { width: 8px; height: 40px; border-radius: 4px; background: linear-gradient(#c1272d 0 50%, #006233 50% 100%); }
  .series .t { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .series .ep { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; padding-left: 14px; border-left: 1px solid var(--line); }
  .headline { font-family: var(--display); font-weight: 800; font-size: 112px; line-height: .92; text-transform: uppercase; letter-spacing: -.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, .6); max-width: 840px; text-wrap: balance; }
  .headline em { font-style: normal; color: var(--gold); }
  .pos-bottom .top { order: 3; } .pos-bottom .mid { order: 1; } .pos-bottom .bottom { order: 2; }
</style>
</head>
<body>
<div class="scene transparent" id="scene">
  <div class="orb a" hidden></div><div class="orb b" hidden></div><div class="stripes" hidden></div><div class="grain" hidden></div>
  <div class="wrap" id="wrap">
    <div class="top">
      <img class="crest in" id="crest" src="../brand/logo.png" alt="Waxys Phantoms crest">
      <div class="plate series in d1" id="series" hidden><div class="flag"></div><div class="t" id="seriesName"></div><div class="ep" id="ep" hidden></div></div>
    </div>
    <div class="mid"><div class="headline in d2" id="title" hidden></div></div>
    <div class="bottom in d3">
      <div class="chip handle" id="handle" hidden></div>
      <div class="chip">twitch.tv/<b>Waxysplash</b></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
(function () {
  const W = window.Waxy;
  const size = +W.param("size", "360"); if (size > 0) document.getElementById("crest").style.height = size + "px";
  const s = W.param("series", ""); if (s) { document.getElementById("series").hidden = false; document.getElementById("seriesName").textContent = s; }
  const ep = W.param("ep", ""); if (ep) { document.getElementById("series").hidden = false; const e = document.getElementById("ep"); e.hidden = false; e.textContent = "Ep " + ep; }
  const t = W.param("title", ""); if (t) { const e = document.getElementById("title"); e.hidden = false; e.innerHTML = t.replace(/\|/g, "<br>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
  const h = W.param("handle", ""); if (h) { const e = document.getElementById("handle"); e.hidden = false; e.innerHTML = `TikTok <b>${h}</b>`; }
  if (W.param("pos", "top") === "bottom") document.getElementById("wrap").classList.add("pos-bottom");
  if (W.param("bg", "")) { document.getElementById("scene").classList.remove("transparent"); document.querySelectorAll(".orb, .stripes, .grain").forEach((e) => (e.hidden = false)); }
})();
</script>
</body>
</html>
