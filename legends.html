<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Sends github.io visitors to waxysplash.com (back on 18 Nov 2026). waxysplash.com deploys from the pimnerds remote, so push site changes there too. */var WAXY_FWD=true;if(WAXY_FWD&&location.hostname.endsWith("github.io")&&!/[?&]obs(=|&|$)/.test(location.search))location.replace("https://waxysplash.com/"+location.pathname.replace(/^\/waxydor\/?/,"")+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Legends · Waxysplash</title>
<meta name="description" content="The Waxys Phantoms Club Legends: the players who built the club, with their all-time and season stats.">

<meta property="og:title" content="Club Legends · Waxysplash">
<meta property="og:description" content="The Waxys Phantoms Club Legends: the players who built the club.">
<meta property="og:url" content="https://waxysplash.com/legends.html">

<link rel="stylesheet" href="styles.css?v=__BUILD__">
<style>
  /* The card below is the same card as card.html (keep the two in step if one changes). Legends always get the gold edge. */
  @font-face { font-family: "PC Display"; src: url("brand/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; }
  @font-face { font-family: "PC Body"; src: url("brand/fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; }
  .pc { --edge: #b9985a; --num: #e9dcbb; font-size: 8.5px; width: 22em; aspect-ratio: 22 / 31; position: relative; display: block; color: #e9dcbb;
        font-family: "PC Body", system-ui, sans-serif; font-weight: 700; text-decoration: none;
        clip-path: polygon(14% 0, 86% 0, 100% 6%, 100% 92%, 50% 100%, 0 92%, 0 6%); background: var(--edge); }
  .pc.big { font-size: 15px; }
  .pc.gold { --edge: #d9a63b; --num: #d9a63b; }
  .pc.gaffer { --edge: #9d3a2b; }
  .pc .in { position: absolute; inset: .35em; clip-path: inherit; background: radial-gradient(120% 70% at 30% 0%, #3a3826 0%, #2a2a1e 55%, #1f1e15 100%); }
  /* khaki inner line, like the crest: a khaki shield with the card's own fill laid just inside it */
  .pc .in::before, .pc .in::after { content: ""; position: absolute; clip-path: polygon(14% 0, 86% 0, 100% 6%, 100% 92%, 50% 100%, 0 92%, 0 6%); z-index: 0; }
  .pc .in::before { inset: .7em; background: rgba(155, 154, 106, .75); }
  .pc .in::after { inset: .84em; background: radial-gradient(120% 70% at 30% 0%, #3a3826 0%, #2a2a1e 55%, #1f1e15 100%); }
  .pc .in > * { z-index: 1; }
  .pc .in { overflow: hidden; }
  /* Layout follows a real FC card: rating and position stacked top left, club badge under them, picture top right,
     then name, a thin rule, the stats and one small tag. Everything keeps 3em clear of the edge so nothing touches the inner line. */
  .pc .wm { position: absolute; right: -1em; top: 4em; width: 15em; opacity: .045; }
  .pc .top { position: absolute; left: 3em; top: 3em; width: 4.6em; text-align: center; }
  .pc .num { font-family: "PC Display", sans-serif; font-weight: 800; font-size: 4.8em; line-height: .85; color: var(--num); }
  .pc .num.trial { font-size: 2.3em; line-height: 1.2; letter-spacing: .04em; }
  .pc .lbl { font-size: .62em; letter-spacing: .16em; text-transform: uppercase; color: #a8a07e; margin-top: .3em; }
  .pc .pos { font-family: "PC Display", sans-serif; font-size: 1.8em; letter-spacing: .06em; margin-top: .15em; line-height: 1; }
  .pc .crest { position: absolute; right: 3.2em; top: 3.2em; width: 3.6em; filter: drop-shadow(0 .3em .6em rgba(0, 0, 0, .45)); }
  .pc .arm { position: absolute; left: 6.9em; top: 2.9em; width: 1.7em; height: 1.7em; border-radius: 50%; background: #9d3a2b; color: #e9dcbb;
             display: grid; place-items: center; font-family: "PC Display", sans-serif; font-size: 1em; box-shadow: 0 0 0 .12em #d9a63b; z-index: 2; }
  /* With a photo it fills the top right; the badge moves under the position, small. */
  .pc .pimg { position: absolute; left: 8.4em; right: 2.2em; top: 2em; height: 11.6em; width: auto; object-fit: cover; object-position: 50% 15%;
              -webkit-mask-image: linear-gradient(#000 72%, transparent), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
              -webkit-mask-composite: source-in; mask-image: linear-gradient(#000 72%, transparent), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-composite: intersect; }
  .pc.has-ph .crest { left: 4.1em; right: auto; top: 10.4em; width: 2.4em; }
  .pc.has-ph .wm { display: none; }
  .pc .name { position: absolute; left: 3em; right: 3em; top: 14.3em; text-align: center; }
  .pc .name b { display: block; font-family: "PC Display", sans-serif; font-weight: 800; font-size: 2em; line-height: 1; text-transform: uppercase; letter-spacing: .02em;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .name span { display: block; font-size: .72em; color: #a8a07e; margin-top: .3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .rule { position: absolute; left: 4em; right: 4em; top: 18.2em; height: .1em; background: linear-gradient(90deg, transparent, var(--edge), transparent); }
  /* Stats are a small table: a header row, all-time numbers in brass, then this season's numbers. */
  .pc .stats { position: absolute; left: 3em; right: 3.2em; top: 18.9em; display: grid; grid-template-columns: 2.8em repeat(6, minmax(0, 1fr)); row-gap: .35em; align-items: baseline; text-align: center; }
  .pc .stats b { display: block; font-family: "PC Display", sans-serif; font-size: 1.35em; line-height: 1; }
  .pc .stats b.all { color: #b9985a; }
  .pc .stats span, .pc .stats i { font-size: .55em; letter-spacing: .08em; color: #a8a07e; font-style: normal; }
  .pc .stats i { text-align: left; letter-spacing: .1em; font-size: .46em; line-height: 1.1; align-self: center; }
  .pc .foot { position: absolute; left: 0; right: 0; top: 24.6em; text-align: center; }
  .pc .foot .tag { display: inline-block; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; font-size: .58em; letter-spacing: .12em; text-transform: uppercase; color: #2a2a1e; background: var(--edge); padding: .3em .8em; border-radius: .3em; }
  /* Tilt and shine: the card leans toward the pointer and a foil glint follows it (not on touch, not with reduced motion). */
  .tilt { perspective: 900px; display: block; }
  .tilt .pc { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s var(--ease); will-change: transform; }
  .tilt.moving .pc { transition: transform .05s linear; }
  .pc .shine { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .25s; mix-blend-mode: soft-light;
    background: radial-gradient(40% 30% at var(--mx, 50%) var(--my, 30%), rgba(255,240,200,.9), transparent 70%),
                linear-gradient(115deg, transparent 35%, rgba(217,166,59,.35) 48%, rgba(233,220,187,.5) 50%, rgba(217,166,59,.35) 52%, transparent 65%); background-size: 100% 100%, 250% 250%; background-position: 0 0, var(--sx, 50%) 50%; }
  .tilt.moving .shine { opacity: 1; }
  .pc.gold .shine { mix-blend-mode: overlay; }

  /* One block per legend: the card, then a name plate and a line about them. */
  .legs { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 34px 20px; justify-items: center; padding: 8px 0 6px; container-type: inline-size; }
  .leg { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; max-width: 100%; }
  .leg .pc { font-size: 14px; }
  .leg .cap { margin-top: 16px; max-width: 24em; }
  .leg .cap .since { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .leg .cap p { margin: 8px 0 10px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .leg .cap a { color: var(--cream); font-size: 13px; font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--brass); }
  .leg .cap a:hover { color: var(--gold); }
  @media (max-width: 760px) {
    .legs { grid-template-columns: minmax(0, 1fr); }
    .leg .pc { font-size: min(14px, calc((100cqi - 8px) / 22)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="crest" src="brand/crest.png" alt="Waxys Phantoms crest">
      <div>
        <h1>Club Legends</h1>
        <div class="sub">The players who built Waxys Phantoms</div>
      </div>
    </div>
  </header>

  <div class="card">
    <p class="note">Club Legends keep playing and keep their stats, but they sit out of the Waxy d'Or race. On each card the brass line is every game for the Phantoms since Season 1, the line under it is this season. Tap a card to open it.</p>
    <div class="legs" id="legs"></div>
  </div>
</div>

<script src="ranking.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  // One line about each legend, written by the captain. Until he gives one, a plain line from their numbers is shown.
  const TRIBUTES = {
    // "Poke_1101": "…",
  };
  // What the club calls them (from the captain, 22 Nov 2026). The card shows this big, with the EA gamertag under it.
  const NICK = { "DYL_597": "Dyl", "Portugal__23": "Dev", "Poke_1101": "Tito", "Papi_iz_finessin": "Griezy" };
  const nick = (n) => NICK[n] || Object.entries(NICK).find(([k]) => k.toLowerCase() === n.toLowerCase())?.[1] || n;
  const bust = "?t=" + Math.floor(Date.now() / 60000);
  const DATA = /(^|\.)github\.io$|^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "data/" : "https://raw.githubusercontent.com/Waxysplash/waxydor/main/data/";
  const load = (f) => fetch(DATA + f + bust).then((r) => { if (!r.ok) throw new Error(f); return r.json(); });
  const [config, members, matchStore, awards] = await Promise.all([load("config.json"), load("members.json"), load("matches.json"), load("awards.json")]);
  const now = new Date();
  const season = config.seasons.find((s) => new Date(s.start) <= now && now <= new Date(s.end)) || config.seasons.at(-1);
  let snapshot = { members: [] };
  try { snapshot = await load("snapshots/" + season.id + "-start.json"); } catch (e) {}
  const R = WaxyRanking.rank({ config, members, matches: matchStore.matches, snapshot, season });
  const API = ((config.fanVote && config.fanVote.apiUrl) || "").replace(/\/$/, "");
  let photos = {};
  try { photos = (await Promise.race([fetch(API + "/api/photo").then((r) => r.json()), new Promise((_, no) => setTimeout(no, 2500))])).photos || {}; } catch (e) {}
  const photoUrl = (name) => photos[name] ? `${API}/api/photo?p=${encodeURIComponent(name)}&v=${photos[name]}` : "";

  const byName = new Map(members.members.map((m) => [m.name, m]));
  function career(name) {
    const m = byName.get(name) || {};
    let sv = 0, gc = 0;
    for (const x of matchStore.matches) for (const p of x.players) if (p.name === name && p.pos === "goalkeeper") { sv += +p.saves || 0; gc += +p.goalsConceded || 0; }
    return { gp: +m.gamesPlayed || 0, g: +m.goals || 0, a: +m.assists || 0, mom: +m.manOfTheMatch || 0, passPct: +m.passSuccessRate || 0,
      winPct: +m.winRate || 0, rating: +m.ratingAve || 0, savePct: sv + gc ? Math.round(100 * sv / (sv + gc)) : null };
  }

  // Every name in config.legends gets a card, even one with no apps yet this season. Most all-time apps first.
  const inSeason = new Map((R.legends || []).map((r) => [r.name.toLowerCase(), r]));
  const legends = (config.legends || []).map((n) => {
    const r = inSeason.get(n.toLowerCase());
    if (r) return r;
    const m = members.members.find((x) => x.name.toLowerCase() === n.toLowerCase()) || { name: n };
    return { name: m.name, pro: m.proName || "", pos: m.favoritePosition || null, ovr: +m.proOverall || 0, gp: 0, g: 0, a: 0, mom: 0, passPct: 0, winPct: 0, rating: 0, savePct: null };
  }).sort((x, y) => career(y.name).gp - career(x.name).gp);

  const POS = { forward: "FWD", midfielder: "MID", defender: "DEF", goalkeeper: "GK" };
  const ROLE = { forward: "Forward", midfielder: "Midfielder", defender: "Defender", goalkeeper: "Keeper" };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const names = Object.fromEntries(awards.awards.map((a) => [a.id, a.name]));
  const honours = (name) => Object.entries(awards.winners || {}).reverse()
    .flatMap(([s, w]) => Object.entries(w).filter(([, who]) => who === name).map(([id]) => `${s.toUpperCase()} ${names[id] || id}`));
  const fromS = (config.seasons || []).find((s) => s.id === config.legendsFrom);
  const since = fromS ? `Club Legend since ${fromS.name}` : "Club Legend";

  function cardHtml(r) {
    const top = r.ovr > 0 ? `<div class="num">${r.ovr}</div><div class="lbl">OVR</div>` : `<div class="num trial">NEW</div><div class="lbl">OVR</div>`;
    const h = honours(r.name)[0];
    const cols = (s) => r.pos === "goalkeeper"
      ? [["APP", s.gp], ["SV%", s.savePct ?? "–"], ["MOTM", s.mom], ["PAS%", s.passPct], ["WIN%", s.winPct], ["RAT", s.rating.toFixed(1)]]
      : [["APP", s.gp], ["GLS", s.g], ["AST", s.a], ["MOTM", s.mom], ["PAS%", s.passPct], ["RAT", s.rating.toFixed(1)]];
    const cur = cols(r).map(([k, v], i) => [k, r.gp || !i ? v : "–"]), ever = cols(career(r.name));
    const stats = `<span></span>${cur.map(([k]) => `<span>${k}</span>`).join("")}
      <i>ALL<br>TIME</i>${ever.map(([, v]) => `<b class="all">${v}</b>`).join("")}
      <i>${/^season\s+/i.test(season.name) ? "SEASON<br>" + esc(season.name.replace(/^season\s+/i, "")) : esc(season.name)}</i>${cur.map(([, v]) => `<b>${v}</b>`).join("")}`;
    const ph = photoUrl(r.name);
    return `<a class="pc gold${ph ? " has-ph" : ""}" href="card.html?p=${encodeURIComponent(r.name)}" aria-label="${esc(r.name)} player card">
      <div class="in">
        <img class="wm" src="brand/crest.png" alt="">
        ${ph ? `<img class="pimg" src="${ph}" alt="" loading="lazy" crossorigin="anonymous">` : ""}
        <div class="top">${top}<div class="pos">${POS[r.pos] || "–"}</div></div>
        <img class="crest" src="brand/crest.png" alt="">
        <div class="name"><b style="font-size:${(2 * Math.min(1, 13 / Math.max(13, nick(r.name).length))).toFixed(2)}em">${esc(nick(r.name))}</b><span>${esc(nick(r.name) !== r.name ? r.name : r.pro || "")}${h ? ` · ★ ${esc(h)}` : ""}</span></div>
        <div class="rule"></div>
        <div class="stats">${stats}</div>
        <div class="foot"><span class="tag">★ Club legend</span></div>
        <i class="shine"></i>
      </div>
    </a>`;
  }

  // The plain line, until the captain writes one: what they have done for the club, in numbers.
  function line(r) {
    if (TRIBUTES[r.name]) return esc(TRIBUTES[r.name]);
    const c = career(r.name);
    const bits = [`${c.gp} app${c.gp === 1 ? "" : "s"}`];
    if (r.pos === "goalkeeper") { if (c.savePct != null) bits.push(`${c.savePct}% of shots saved`); }
    else bits.push(`${c.g} goal${c.g === 1 ? "" : "s"}`, `${c.a} assist${c.a === 1 ? "" : "s"}`);
    return `${ROLE[r.pos] || "Player"} for Waxys Phantoms: ${bits.join(", ")} since Season 1.`;
  }

  $("#legs").innerHTML = legends.length ? legends.map((r) => `<div class="leg">
      <div class="tilt">${cardHtml(r)}</div>
      <div class="cap"><span class="since">${esc(since)}</span><p>${line(r)}</p><a href="card.html?p=${encodeURIComponent(r.name)}">Open ${esc(nick(r.name))}'s card</a></div>
    </div>`).join("") : `<div class="note">No Club Legends yet.</div>`;

  // Tilt and shine, as on the player cards (mouse and pen only).
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll(".tilt").forEach((t) => {
    t.addEventListener("pointermove", (e) => {
      if (e.pointerType === "touch") return;
      const b = t.getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
      t.classList.add("moving");
      t.style.setProperty("--ry", ((x - .5) * 16).toFixed(2) + "deg"); t.style.setProperty("--rx", ((.5 - y) * 12).toFixed(2) + "deg");
      t.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); t.style.setProperty("--my", (y * 100).toFixed(1) + "%"); t.style.setProperty("--sx", (x * 100).toFixed(1) + "%");
    });
    t.addEventListener("pointerleave", () => { t.classList.remove("moving"); t.style.setProperty("--rx", "0deg"); t.style.setProperty("--ry", "0deg"); });
  });
})();
</script>
<script src="nav.js?v=__BUILD__"></script>
</body>
</html>
