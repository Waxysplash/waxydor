<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waxy d'Or links</title>
<link rel="stylesheet" href="overlays/brand.css">
<style>
  body { background: var(--bg); color: var(--text); padding: 28px 16px 80px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-family: var(--display); font-size: 40px; text-transform: uppercase; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  h2 { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 26px 0 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--deep); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .row .n { font-weight: 600; }
  .row .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row code { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #d9c4ff; word-break: break-all; margin-top: 4px; }
  .btn { font: inherit; font-weight: 600; font-size: 13px; color: var(--text); background: var(--glass-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--purple); }
  .btn.ok { border-color: var(--green); color: var(--green); }
  a { color: var(--purple); }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Waxy d'Or links</h1>
  <p class="lead">Everything in one place. Tap Copy, paste into OBS or the bot. Swap the numbers in the address (matchday, time, raid) before you go live.</p>
  <div id="list"></div>
</div>
<script>
const B = "https://waxysplash.github.io/waxydor/";
const GROUPS = [
  ["Site", [
    ["Stats site", "", B],
    ["Twitch panel kit", "headers and the copy for each panel", B + "brand/panels.html"],
    ["Matchday Ops checklist", "private, opens in Claude", "https://claude.ai/artifact/DY8B8VCcoQnyBWAp921RNB"],
  ]],
  ["OBS scenes · 1920×1080", [
    ["Starting soon", "at = kick-off time, md = matchday", B + "overlays/starting.html?at=19:00&md=12"],
    ["In-game HUD", "transparent, over the game", B + "overlays/hud.html?md=12"],
    ["Half time / BRB", "", B + "overlays/brb.html"],
    ["Full time", "raid = who you are raiding", B + "overlays/ending.html?raid=StreamerName&md=12"],
    ["Lower third", "transparent, hides after 12 s", B + "overlays/lowerthird.html?title=Press%20conference&for=12"],
  ]],
  ["Vertical · 1080×1920 · channel brand (Road to Glory etc.)", [
    ["Vertical brand overlay", "series + episode + headline, no club data", B + "overlays/vertical-brand.html?series=Morocco%20Road%20to%20Glory&ep=1&title=The%20*road*%20begins"],
    ["Vertical brand, headline at the bottom", "", B + "overlays/vertical-brand.html?series=Morocco%20Road%20to%20Glory&ep=1&pos=bottom&title=Pack%20*luck*%3F"],
    ["Vertical brand, background on", "for talking-head clips", B + "overlays/vertical-brand.html?series=Morocco%20Road%20to%20Glory&ep=1&bg=1"],
  ]],
  ["Vertical · 1080×1920 · Pro Clubs", [
    ["Vertical overlay", "transparent; title = headline, *word* turns gold", B + "overlays/vertical.html?md=12&title=Could%20your%20captain%20do%20*this*%3F"],
    ["Vertical, headline at the bottom", "", B + "overlays/vertical.html?md=12&pos=bottom&title=Rate%20my%20*teammate*"],
    ["Vertical, no table, brand background", "for talking-head clips", B + "overlays/vertical.html?table=0&bg=1&title=Press%20*conference*"],
  ]],
  ["Leaderboard widgets", [
    ["Full squad", "500×560", B + "overlay.html"],
    ["Compact top five", "360×200", B + "overlay.html?mode=top5"],
  ]],
  ["Chat bot", [
    ["!table", "StreamElements or Nightbot command response", "$(urlfetch https://raw.githubusercontent.com/Waxysplash/waxydor/main/data/table.txt)"],
    ["!waxydor", "command response", "The Waxy d'Or race, every stat, every match: " + B],
  ]],
];
document.getElementById("list").innerHTML = GROUPS.map(([g, rows]) => `<h2>${g}</h2>` + rows.map(([n, s, u]) => `<div class="row"><div><div class="n">${n}</div>${s ? `<div class="s">${s}</div>` : ""}<code>${u.replace(/&/g, "&amp;")}</code></div><button class="btn" data-u="${u.replace(/"/g, "&quot;")}">Copy</button></div>`).join("")).join("");
document.getElementById("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-u]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.u); b.textContent = "Copied"; b.classList.add("ok"); setTimeout(() => { b.textContent = "Copy"; b.classList.remove("ok"); }, 1500); }
  catch (err) { const r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector("code")); getSelection().removeAllRanges(); getSelection().addRange(r); }
});
</script>
</body>
</html>
