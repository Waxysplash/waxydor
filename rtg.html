<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Old GitHub Pages copy: send visitors to waxysplash.com (OBS sources with ?obs are left alone). */if(location.hostname.endsWith("github.io")&&!/[?&]obs(=|&|$)/.test(location.search))location.replace("https://waxysplash.com/"+location.pathname.replace(/^\/waxydor\/?/,"")+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to Glory · Waxysplash</title>
<meta name="description" content="Morocco Road to Glory: a full Moroccan Ultimate Team in EA FC 27, one TikTok episode at a time. Every episode and every FUT Champs record.">
<link rel="icon" href="brand/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#9d3a2b">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Waxysplash">
<meta property="og:title" content="Morocco Road to Glory · Waxysplash">
<meta property="og:description" content="A full Moroccan Ultimate Team in EA FC 27, one TikTok episode at a time.">
<meta property="og:image" content="https://waxysplash.com/brand/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=__BUILD__">
<style>
  /* The matchday programme: Road to Glory is printed on cream paper, unlike the dark match centre around it. */
  .prog { --ink2: #2a2a1e; --paper: #eadfc1; --rule: #2a2a1e; --soft: #6e6849; color: var(--ink2); background-color: var(--paper); border-radius: 22px; padding: 28px clamp(16px, 4vw, 40px) 36px; margin-top: 18px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16  0 0 0 0 .16  0 0 0 0 .1  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .masthead { text-align: center; border-top: 4px double var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0 14px; }
  .masthead .k { font-size: 11px; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--soft); }
  .masthead h1 { margin: 6px 0 4px; font-family: var(--display); font-size: clamp(36px, 7vw, 72px); line-height: .95; color: var(--ink2); }
  .masthead h1 span { color: #9d3a2b; }
  .masthead p { margin: 8px auto 0; max-width: 34em; color: #4b4932; }
  .issue { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); padding: 6px 2px 0; }
  .champs { margin: 28px 0 8px; }
  .champs h2, .eps-h { font-family: var(--display); font-size: 24px; margin: 0 0 12px; color: var(--ink2); }
  .wk { display: grid; grid-template-columns: 120px 1fr 64px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed #b9a982; }
  .wk .lbl { font-weight: 700; font-size: 14px; }
  .wk .lbl small { display: block; color: var(--soft); font-weight: 600; font-size: 12px; }
  .wk .bar2 { display: flex; height: 26px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(42,42,30,.4) inset; }
  .wk .bar2 i { display: block; height: 100%; transform-origin: left; animation: grow .9s var(--ease) both; }
  .wk .bar2 .w { background: #5f7a2a; } .wk .bar2 .l { background: #9d3a2b; }
  .wk .bar2 .half { position: relative; }
  .wk .rec { font-family: var(--num); font-size: 24px; text-align: right; }
  @keyframes grow { from { transform: scaleX(0); } }
  .eps-h { margin-top: 32px; display: flex; justify-content: space-between; align-items: baseline; }
  .eps-h a { font-family: var(--font); font-size: 14px; font-weight: 800; color: #9d3a2b; }
  .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 16px; }
  .ep { all: unset; cursor: pointer; display: block; }
  .ep .cv { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: #2a2a1e; box-shadow: 0 12px 24px -12px rgba(0,0,0,.55); transition: transform .25s var(--ease), box-shadow .25s; }
  .ep:nth-child(odd) .cv { transform: rotate(-1.2deg); } .ep:nth-child(even) .cv { transform: rotate(1.2deg); }
  .ep:hover .cv, .ep:focus-visible .cv { transform: rotate(0) translateY(-4px) scale(1.02); box-shadow: 0 18px 30px -12px rgba(0,0,0,.6); }
  .ep .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ep .cv .soon { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #e9dcbb; font-family: var(--display); font-size: 22px; padding: 16px;
    background: repeating-linear-gradient(135deg, #2a2a1e 0 14px, #33331f 14px 28px); }
  .ep .cv .stamp { position: absolute; right: 8px; top: 8px; background: #e9dcbb; color: #2a2a1e; font-family: var(--num); font-size: 18px; padding: 2px 8px; border-radius: 4px; transform: rotate(6deg); box-shadow: 0 0 0 2px #2a2a1e; }
  .ep .n { margin-top: 10px; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #9d3a2b; }
  .ep .t { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.15; color: var(--ink2); }
  .ep .l { font-size: 13px; color: #4b4932; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep.open .l { -webkit-line-clamp: unset; }
  .follow { margin-top: 30px; text-align: center; border-top: 1px solid var(--rule); padding-top: 18px; }
  .follow a { display: inline-block; background: #2a2a1e; color: #e9dcbb; font-weight: 800; padding: 12px 20px; border-radius: 12px; }
  .follow a:hover { background: #9d3a2b; color: #e9dcbb; }
  @media (max-width: 560px) { .eps { grid-template-columns: repeat(2, 1fr); gap: 18px 12px; } .wk { grid-template-columns: 92px 1fr 54px; } }
</style>
</head>
<body>
<div class="wrap">
  <article class="prog rv">
    <div class="issue"><span>Waxys Phantoms presents</span><span id="issueNo"></span></div>
    <header class="masthead">
      <div class="k">The series · on TikTok</div>
      <h1>Morocco <span>Road to Glory</span></h1>
      <p id="tagline"></p>
    </header>

    <section class="champs">
      <h2>FUT Champs weekends</h2>
      <div id="weeks"></div>
    </section>

    <div class="eps-h"><span>Every episode</span><a id="tt" href="https://www.tiktok.com/@waxysplash" target="_blank" rel="noopener">Watch on TikTok ↗</a></div>
    <div class="eps" id="eps"></div>

    <div class="follow"><a href="https://www.tiktok.com/@waxysplash" target="_blank" rel="noopener">Follow @waxysplash for the next episode ↗</a></div>
  </article>
</div>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const DATA = /(^|\.)github\.io$|^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "data/" : "https://raw.githubusercontent.com/Waxysplash/waxydor/main/data/";
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rtg = await fetch(DATA + "rtg.json?t=" + Math.floor(Date.now() / 6e4)).then((r) => r.json());
  const eps = rtg.episodes || [];
  $("#tagline").textContent = rtg.tagline || "";
  $("#issueNo").textContent = `${eps.length} episodes`;
  if (rtg.tiktok) $("#tt").href = rtg.tiktok;
  // One bar per FUT Champs weekend: wins in green, losses in red, out of the 15 games.
  const weeks = eps.filter((e) => e.record).map((e) => { const [w, l] = e.record.match(/\d+/g).map(Number); return { e, w, l }; });
  $("#weeks").innerHTML = weeks.map(({ e, w, l }, i) => `<div class="wk"><div class="lbl">Weekend ${i + 1}<small>Episode ${e.n}</small></div>
      <div class="bar2" title="${w} wins, ${l} losses"><i class="w" style="width:${100 * w / (w + l)}%"></i><i class="l" style="width:${100 * l / (w + l)}%;animation-delay:.15s"></i></div>
      <div class="rec">${w}–${l}</div></div>`).join("") || `<p>The first Champs weekend is coming.</p>`;
  $("#eps").innerHTML = [...eps].reverse().map((e) => `<button class="ep" aria-expanded="false">
      <div class="cv">${e.cover ? `<img src="${esc(e.cover)}" alt="Episode ${e.n} cover" loading="lazy">` : `<div class="soon">${esc(e.status || "Coming soon")}</div>`}${e.record ? `<span class="stamp">${esc(e.record)}</span>` : ""}</div>
      <div class="n">Episode ${e.n}${e.status ? " · " + esc(e.status) : ""}</div><div class="t">${esc(e.title)}</div><div class="l">${esc(e.line || "")}</div></button>`).join("");
  $("#eps").addEventListener("click", (ev) => { const b = ev.target.closest(".ep"); if (!b) return; const o = b.classList.toggle("open"); b.setAttribute("aria-expanded", o); });
})();
</script>
<script src="nav.js?v=__BUILD__"></script>
</body>
</html>
